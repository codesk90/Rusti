[package]
name = "rusti"
version = "0.2.0"
edition = "2024"
description = "A Rust terminal workbench for AI coding agents."
license = "MIT OR Apache-2.0"
repository = "https://github.com/codesk90/Rusti"
readme = "README.md"
keywords = ["terminal", "tui", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
portable-pty = "0.8"
